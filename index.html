<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>随意玻璃态 · 随机一言</title>
    <!-- 使用 Font Awesome 6 免费图标库 (CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- 谷歌字体 (Poppins 提升现代感，不影响基础结构) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
    <style>
        /* 基础重置与字体 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            /* 渐变背景 + 微流动动画 (随意但有趣) */
            background: linear-gradient(125deg, #f6d5f7, #a0d2ff, #c7e9fb, #f9d6e0);
            background-size: 400% 400%;
            animation: gradientBG 18s ease infinite;
            color: #1e2b3c;
            line-height: 1.5;
            padding: 1rem;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 弹性布局：把main撑开，footer置底 */
        .layout {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        main {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem 0;
        }

        /* 玻璃卡片 */
        .glass-card {
            max-width: 620px;
            width: 100%;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(15px) saturate(180%);
            -webkit-backdrop-filter: blur(15px) saturate(180%);
            border-radius: 2.5rem;
            padding: 2.5rem 2rem;
            box-shadow: 0 25px 45px -10px rgba(0, 20, 40, 0.25),
                        0 0 0 1px rgba(255, 255, 255, 0.4) inset;
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: transform 0.2s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 32px 55px -8px rgba(10, 30, 50, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.7) inset;
        }

        /* 顶部图标区 */
        .card-icon {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
            font-size: 3.2rem;
            color: rgba(40, 60, 100, 0.7);
            text-shadow: 0 5px 12px rgba(255,255,255,0.6);
        }

        .card-icon i {
            margin: 0 0.2rem;
            filter: drop-shadow(0 6px 8px rgba(0,0,0,0.1));
        }

        /* 标题 */
        h1 {
            text-align: center;
            font-weight: 500;
            font-size: 2rem;
            letter-spacing: 1px;
            color: #1a2b3e;
            background: linear-gradient(145deg, #1e2f41, #2c4058);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.75rem;
            text-shadow: 0 2px 5px rgba(255,255,255,0.5);
        }

        .subhead {
            text-align: center;
            font-size: 0.95rem;
            font-weight: 300;
            color: #2e405b;
            background: rgba(255,255,255,0.3);
            display: inline-block;
            padding: 0.25rem 1.2rem;
            border-radius: 40px;
            margin: 0 auto 2rem auto;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.6);
        }

        /* 引用容器 */
        .quote-wrapper {
            margin: 2rem 0 2.5rem 0;
            position: relative;
        }

        .quote-text {
            font-size: 1.75rem;
            font-weight: 450;
            line-height: 1.4;
            text-align: center;
            color: #11212e;
            quotes: "“" "”" "‘" "’";
            padding: 0 0.2rem;
            text-shadow: 0 1px 3px rgba(255,255,255,0.3);
        }

        .quote-text::before {
            content: "“";
            font-size: 2.8rem;
            line-height: 1;
            color: rgba(70, 100, 150, 0.5);
            margin-right: 0.25rem;
            vertical-align: middle;
            font-family: serif;
        }

        .quote-text::after {
            content: "”";
            font-size: 2.8rem;
            line-height: 1;
            color: rgba(70, 100, 150, 0.5);
            margin-left: 0.15rem;
            vertical-align: bottom;
            font-family: serif;
        }

        .quote-author {
            text-align: right;
            font-size: 1.3rem;
            font-weight: 300;
            margin-top: 1rem;
            padding-right: 0.8rem;
            color: #1f3a4f;
            border-right: 4px solid rgba(255,255,255,0.75);
            letter-spacing: 0.5px;
            text-shadow: 0 1px 3px rgba(255,255,255,0.5);
        }

        .quote-author::before {
            content: "— ";
            opacity: 0.7;
            font-weight: 300;
        }

        /* 按钮区域 */
        .button-container {
            display: flex;
            justify-content: center;
            margin: 2rem 0 0.5rem;
        }

        .random-btn {
            background: rgba(255, 255, 255, 0.8);
            border: none;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 1rem 2.5rem;
            border-radius: 60px;
            font-size: 1.3rem;
            font-weight: 500;
            color: #1f3a4f;
            box-shadow: 0 12px 22px -10px rgba(20, 40, 70, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.9);
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }

        .random-btn i {
            font-size: 1.3rem;
            color: #3a5a7a;
            transition: transform 0.3s ease;
        }

        .random-btn:hover {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 16px 30px -6px #1e3f5e3f;
            transform: scale(1.02);
            border-color: white;
        }

        .random-btn:hover i {
            transform: rotate(120deg);
        }

        .random-btn:active {
            transform: scale(0.98);
            background: rgba(240, 248, 255, 0.9);
        }

        /* footer 随意小尾巴 */
        .footer {
            text-align: center;
            padding: 1.2rem 0.5rem;
            font-size: 0.95rem;
            color: #21364b;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 60px;
            width: fit-content;
            margin: 1rem auto 0.5rem;
            padding: 0.7rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.05);
        }

        .footer i {
            color: #b03a5e;
            margin: 0 4px;
            font-size: 0.9rem;
        }

        .footer a {
            color: #1f4761;
            text-decoration: none;
            border-bottom: 1px dotted rgba(31, 71, 97, 0.4);
        }

        /* 手机小屏微调 */
        @media (max-width: 480px) {
            .glass-card {
                padding: 1.8rem 1.2rem;
                border-radius: 2rem;
            }
            h1 {
                font-size: 1.8rem;
            }
            .quote-text {
                font-size: 1.4rem;
            }
            .quote-author {
                font-size: 1.1rem;
            }
            .random-btn {
                padding: 0.8rem 1.8rem;
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <!-- 使用flex列布局：main占满剩余空间，footer自动沉底 -->
    <div style="display: flex; flex-direction: column; min-height: 100vh; width: 100%;">
        <!-- 居中区域 -->
        <div class="layout">
            <main>
                <div class="glass-card">
                    <!-- 随意又可爱的图标区 -->
                    <div class="card-icon">
                        <i class="fas fa-comment-dots"></i>
                        <i class="fas fa-star"></i>
                        <i class="fas fa-face-smile"></i>
                    </div>

                    <h1>随意漫游·一言</h1>
                    <div style="text-align: center;">
                        <span class="subhead"><i class="far fa-clock" style="margin-right: 6px;"></i> 今日份的随想</span>
                    </div>

                    <!-- 引文主体 -->
                    <div class="quote-wrapper">
                        <p class="quote-text" id="quoteDisplay">加载一句灵感...</p>
                        <p class="quote-author" id="authorDisplay">佚名</p>
                    </div>

                    <!-- 刷新按钮 + 随机趣味 -->
                    <div class="button-container">
                        <button class="random-btn" id="newQuoteBtn">
                            <i class="fas fa-shuffle"></i> 随便换一句
                        </button>
                    </div>

                    <!-- 微装饰，纯气氛组 -->
                    <div style="display: flex; justify-content: center; gap: 1rem; margin-top: 1rem; font-size: 1rem; color: rgba(40,60,80,0.6);">
                        <i class="fas fa-ellipsis"></i>
                    </div>
                </div>
            </main>
        </div>

        <!-- 页脚，随意但可爱 -->
        <footer class="footer">
            <i class="fas fa-cat"></i> 随意静态页面 · 灵感碰撞 <i class="fas fa-heart" style="color: #c4456e;"></i> · 
            <span id="currentYear"></span> 
            <i class="fas fa-feather"></i>
        </footer>
    </div>

    <!-- 简单的随机名言逻辑 (完全静态但活泼) -->
    <script>
        (function() {
            // 随意收集的一些名言/调侃 (混合中英文)
            const quotesCollection = [
                { quote: "Talk is cheap. Show me the code.", author: "Linus Torvalds" },
                { quote: "任何足够先进的科技，都与魔法无异。", author: "Arthur C. Clarke" },
                { quote: "保持简单，保持愚蠢。", author: "KISS 原则" },
                { quote: "在计算机的世界里，没有银弹。", author: "Fred Brooks" },
                { quote: "代码未写，漏洞已生。", author: "程序员谚语" },
                { quote: "简单是复杂的终极形式。", author: "列奥纳多·达·芬奇" },
                { quote: "最好的预测未来的方式是创造未来。", author: "Alan Kay" },
                { quote: "任何傻瓜都能写出计算机能理解的代码。优秀的程序员能写出人能理解的代码。", author: "Martin Fowler" },
                { quote: "我思故我在。", author: "笛卡尔" },
                { quote: "机器学习就是：如果你用Python调包，你就是调包侠；如果用C++，你就是人工智能专家。", author: "网友" },
                { quote: "保持冷静，继续编码。", author: "佚名" },
                { quote: "程序=数据结构+算法。", author: "Nicklaus Wirth" },
                { quote: "首先解决问题，然后写代码。", author: "John Johnson" },
                { quote: "晚上的代码，早上的bug。", author: "嵌入式笑话" }
            ];

            const quoteEl = document.getElementById('quoteDisplay');
            const authorEl = document.getElementById('authorDisplay');
            const btn = document.getElementById('newQuoteBtn');

            // 随机取一句 (允许重复，随意)
            function updateRandomQuote() {
                const randomIndex = Math.floor(Math.random() * quotesCollection.length);
                const item = quotesCollection[randomIndex];
                quoteEl.textContent = item.quote;
                // 作者元素我们利用伪元素已经加了"— "，所以只填名字
                authorEl.textContent = item.author;
            }

            // 首次加载显示随机一句
            updateRandomQuote();

            // 按钮点击事件
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                updateRandomQuote();
                // 小小的触感反馈（按钮自带旋转动画）
                // 也可以额外加个微震动感 (可选)
                btn.style.transition = 'all 0.15s';
                setTimeout(() => {
                    btn.style.transform = 'scale(1)';
                }, 100);
            });

            // 动态更新页脚年份
            document.getElementById('currentYear').textContent = new Date().getFullYear();
        })();
    </script>

    <!-- 保证即使JS没加载完也有初始占位 (已经内置) 而且不需要额外操作 -->
</body>
</html>
